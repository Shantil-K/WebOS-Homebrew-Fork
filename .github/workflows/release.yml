# Builds every platform and publishes one GitHub release when a version tag (v1.2.3 or v1.2.3-beta) is pushed.
# Run by hand (workflow_dispatch) it builds everything as downloadable artifacts and publishes nothing.
# The version comes from the tag. Tags with a -suffix are published as pre-releases.
# Release notes come from .github/release-notes/<tag>.md, or are generated from commits if that file is missing.
name: 'Release'
run-name: "${{ github.ref_type == 'tag' && format('Release {0}', github.ref_name) || format('Snapshot {0}', github.sha) }}"

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

env:
  TAURI_BUILD_FLAGS: "${{ github.ref_type == 'tag' && ' ' || '-d' }}"
  ANDROID_NDK_VERSION: '28.2.13676358'
  ANDROID_BUILD_TOOLS_VERSION: '34.0.0'

jobs:
  create-release:
    name: Create Release
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=".github/release-notes/$GITHUB_REF_NAME.md"
          if [ -f "$notes" ]; then set -- --notes-file "$notes"; else set -- --generate-notes; fi
          case "$GITHUB_REF_NAME" in *-*) set -- "$@" --prerelease;; esac
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "WebOS Homebrew Fork $GITHUB_REF_NAME" "$@"

  release:
    name: Build & Release
    needs: create-release
    if: ${{ always() && (needs.create-release.result == 'success' || needs.create-release.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows
            os: windows-latest
          - target: linux-x86_64
            os: ubuntu-24.04
          - target: linux-arm64
            os: ubuntu-24.04-arm
          - target: macos
            os: macos-latest
          - target: android
            os: ubuntu-latest

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - name: Install Required Packages (Linux)
        if: startsWith(matrix.target, 'linux')
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file libssl-dev libayatana-appindicator3-dev \
            librsvg2-dev libwebkit2gtk-4.1-dev xdg-utils
          # The AppImage bundles WebKitGTK; reject the old 2.44 build on both architectures.
          webkit_version="$(pkg-config --modversion webkit2gtk-4.1)"
          echo "Building with WebKitGTK $webkit_version"
          dpkg --compare-versions "$webkit_version" ge 2.52.6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      # One cache per matrix target. The Windows job builds two triples into the same directory.
      - name: Cache Rust Project
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          cache-on-failure: true

      - name: Setup JDK (Android)
        uses: actions/setup-java@v5
        if: startsWith(matrix.target, 'android')
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        if: startsWith(matrix.target, 'android')
        uses: android-actions/setup-android@v4.0.4
        with:
          packages: "build-tools;${{ env.ANDROID_BUILD_TOOLS_VERSION }} ndk;${{ env.ANDROID_NDK_VERSION }} platforms;android-34"

      - name: Add Android SDK Paths
        if: startsWith(matrix.target, 'android')
        shell: bash
        run: |
          echo ${NDK_HOME}/toolchains/llvm/prebuilt/*/bin >> $GITHUB_PATH
          echo ${ANDROID_HOME}/build-tools/${ANDROID_BUILD_TOOLS_VERSION} >> $GITHUB_PATH
        env:
          NDK_HOME: "${{ env.ANDROID_HOME }}/ndk/${{ env.ANDROID_NDK_VERSION }}"

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24.x
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm ci

      - name: Write Version
        id: version
        shell: bash
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then v="${GITHUB_REF_NAME#v}"; else v="0.0.0-dev.${GITHUB_RUN_NUMBER}"; fi
          npm version --no-git-tag-version --allow-same-version "$v"
          printf '{"version":"%s"}' "$v" > src/release.json
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Build the app (Windows)
        if: startsWith(matrix.target, 'windows')
        run: |
          rustup target add i686-pc-windows-msvc
          npm run build -- --features=vendored-openssl --target x86_64-pc-windows-msvc ${{ env.TAURI_BUILD_FLAGS }}
          npm run build -- --features=vendored-openssl --target i686-pc-windows-msvc ${{ env.TAURI_BUILD_FLAGS }}

      - name: Build the app (Linux)
        if: startsWith(matrix.target, 'linux')
        run: npm run build -- --features=vendored-openssl ${{ env.TAURI_BUILD_FLAGS }}

      - name: Verify AppImage packaging
        if: startsWith(matrix.target, 'linux')
        # A bundled libwayland-client breaks the host's Mesa EGL ICD under Wayland (upstream issue #369).
        run: python3 scripts/verify-appimage-packaging.py target/*/bundle/appimage/*.AppImage

      - name: Build the app (macOS)
        if: startsWith(matrix.target, 'macos')
        run: |
          rustup target add x86_64-apple-darwin aarch64-apple-darwin
          npm run build -- --features=vendored-openssl --target universal-apple-darwin ${{ env.TAURI_BUILD_FLAGS }}
        env:
          CI: true

      - name: Build the app (Android)
        if: startsWith(matrix.target, 'android')
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi i686-linux-android x86_64-linux-android
          npm run tauri android init
          npm run tauri android build -- --apk --features vendored-openssl ${{ github.ref_type == 'tag' && ' ' || '--debug' }}
        env:
          NDK_HOME: "${{ env.ANDROID_HOME }}/ndk/${{ env.ANDROID_NDK_VERSION }}"

      - name: Sign the app (Android)
        if: startsWith(matrix.target, 'android')
        env:
          STORE_DATA: ${{ secrets.ANDROID_SIGNING_STORE_DATA }}
          STORE_PASSWORD: ${{ secrets.ANDROID_SIGNING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          apk=$(find src-tauri/gen/android -path '*/outputs/apk/*' -name '*.apk' | head -n 1)
          [ -n "$apk" ] || { echo "::error::No APK was built"; exit 1; }
          mkdir -p target/android
          out="target/android/WebOS.Homebrew.Fork_${VERSION}_universal.apk"
          if [ -z "$STORE_DATA" ]; then
            [ "$GITHUB_REF_TYPE" != tag ] || { echo "::error::ANDROID_SIGNING_* secrets are missing"; exit 1; }
            cp "$apk" "$out"   # manual test runs without secrets keep the debug-signed APK
            exit 0
          fi
          echo "$STORE_DATA" | base64 -d > "$RUNNER_TEMP/android.jks"
          zipalign -f -p 4 "$apk" "$RUNNER_TEMP/aligned.apk"
          apksigner sign --ks "$RUNNER_TEMP/android.jks" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:STORE_PASSWORD --key-pass env:KEY_PASSWORD --out "$out" "$RUNNER_TEMP/aligned.apk"
          apksigner verify "$out"
          rm -f "$RUNNER_TEMP/android.jks" "$out.idsig"

      - name: Glob Build Artifacts
        id: glob
        run: node scripts/list-release-artifacts.js

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        if: ${{ github.ref_type != 'tag' }}
        with:
          name: ${{ matrix.target }}-package
          path: ${{ steps.glob.outputs.paths }}

      - name: Add to Release
        if: ${{ github.ref_type == 'tag' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PATHS: ${{ steps.glob.outputs.paths }}
        run: |
          while IFS= read -r f; do
            [ -n "$f" ] && gh release upload "$GITHUB_REF_NAME" "$f" --clobber
          done <<< "$PATHS"
